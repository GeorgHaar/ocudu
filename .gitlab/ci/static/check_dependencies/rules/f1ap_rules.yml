# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: f1ap-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/f1ap/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/asn1/f1ap/**
      - include/ocudu/f1ap/**
      - include/ocudu/gateways/**
      - include/ocudu/ocudulog/**
      - include/ocudu/ran/**
      - include/ocudu/support/**
    reason: Module F1AP may only depend on the modules listed in allow; anything else breaks its layering boundary.
  - id: f1ap-cu-cp-forbidden-includes
    kind: forbidden-edge
    from:
      - include/ocudu/f1ap/cu_cp/**
      - lib/f1ap/cu_cp/**
    to:
      - include/ocudu/f1ap/du/**
    reason: Sub-module F1AP CU-CP may not include from sub-module F1AP DU.
  - id: f1ap-du-forbidden-includes
    kind: forbidden-edge
    from:
      - include/ocudu/f1ap/du/**
      - lib/f1ap/du/**
    to:
      - include/ocudu/f1ap/cu_cp/**
    reason: Sub-module F1AP DU may not include from sub-module F1AP CU-CP.
