# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: asn1-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/asn1/**
      - lib/asn1/**
    allow:
      - external/nlohmann/**
      - include/ocudu/adt/**
      - include/ocudu/asn1/**
      - include/ocudu/ocudulog/**
      - include/ocudu/support/**
    reason: Module asn1 may only depend on the modules listed in allow; anything else breaks its layering boundary.
  - id: asn1-public-submodules-are-isolated
    kind: peer-isolation
    peers: include/ocudu/asn1/*
    reason: Each ASN.1 protocol (E1AP, NGAP, F1AP, ...) is generated from its own spec and must not depend on another
      protocol's types.
  - id: asn1-private-submodules-are-isolated
    kind: peer-isolation
    peers: lib/asn1/*
    reason: Each ASN.1 protocol sub-module must be isolated from the rest of sub-modules.
  - id: asn1-e1ap-allowed-includes
    kind: allowed-edge
    from: lib/asn1/e1ap/**
    allow: include/ocudu/asn1/e1ap/**
    reason: An ASN.1 E1AP sub-module may only include its own protocol's headers.
  - id: asn1-e2ap-allowed-includes
    kind: allowed-edge
    from: lib/asn1/e2ap/**
    allow: include/ocudu/asn1/e2ap/**
    reason: An ASN.1 E2AP sub-module may only include its own protocol's headers.
  - id: asn1-e2sm-allowed-includes
    kind: allowed-edge
    from: lib/asn1/e2sm/**
    allow: include/ocudu/asn1/e2sm/**
    reason: An ASN.1 E2SM sub-module may only include its own protocol's headers.
  - id: asn1-f1ap-allowed-includes
    kind: allowed-edge
    from: lib/asn1/f1ap/**
    allow: include/ocudu/asn1/f1ap/**
    reason: An ASN.1 F1AP sub-module may only include its own protocol's headers.
  - id: asn1-lpp-allowed-includes
    kind: allowed-edge
    from: lib/asn1/lpp/**
    allow: include/ocudu/asn1/lpp/**
    reason: An ASN.1 LPP sub-module may only include its own protocol's headers.
  - id: asn1-ngap-allowed-includes
    kind: allowed-edge
    from: lib/asn1/ngap/**
    allow: include/ocudu/asn1/ngap/**
    reason: An ASN.1 NGAP sub-module may only include its own protocol's headers.
  - id: asn1-nrppa-allowed-includes
    kind: allowed-edge
    from: lib/asn1/nrppa/**
    allow: include/ocudu/asn1/nrppa/**
    reason: An ASN.1 NRPPA sub-module may only include its own protocol's headers.
  - id: asn1-rrc_nr-allowed-includes
    kind: allowed-edge
    from: lib/asn1/rrc_nr/**
    allow: include/ocudu/asn1/rrc_nr/**
    reason: An ASN.1 RRC sub-module may only include its own protocol's headers.
  - id: asn1-xnap-allowed-includes
    kind: allowed-edge
    from: lib/asn1/xnap/**
    allow: include/ocudu/asn1/xnap/**
    reason: An ASN.1 XNAP sub-module may only include its own protocol's headers.
