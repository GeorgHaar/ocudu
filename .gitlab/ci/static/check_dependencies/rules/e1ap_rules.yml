# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: e1ap-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/e1ap/**
      - lib/e1ap/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/asn1/*.h
      - include/ocudu/asn1/e1ap/**
      - include/ocudu/e1ap/**
      - include/ocudu/gateways/**
      - include/ocudu/ocudulog/**
      - include/ocudu/pcap/**
      - include/ocudu/ran/**
      - include/ocudu/security/**
      - include/ocudu/support/**
      - lib/e1ap/**
    reason: Module E1AP may only depend on the modules listed in allow; anything else breaks its layering boundary.
  - id: e1ap-cu-cp-forbidden-includes
    kind: forbidden-edge
    from:
      - include/ocudu/e1ap/cu_cp/**
      - lib/e1ap/cu_cp/**
    to:
      - include/ocudu/e1ap/cu_up/**
      - lib/e1ap/cu_up/**
    reason: Sub-module E1AP CU-CP cannot include from sub-module E1AP CU-UP.
  - id: e1ap-cu-up-forbidden-includes
    kind: forbidden-edge
    from:
      - include/ocudu/e1ap/cu_up/**
      - lib/e1ap/cu_up/**
    to:
      - include/ocudu/e1ap/cu_cp/**
      - lib/e1ap/cu_cp/**
    reason: Sub-module E1AP CU-UP cannot include from sub-module E1AP CU-CP.
